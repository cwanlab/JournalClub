<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building a Personal Health Agent</title>
<meta name="description" content="An interactive Journal Club tutorial building an LLM health agent step by step: slides on the left, runnable Python on the right, on an All of Us composite.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="bar-brand">
    <span class="bar-title">Building a Personal Health Agent</span>
    <span class="bar-sep" aria-hidden="true">|</span>
    <span class="bar-venue">Journal Club</span>
  </div>
  <p class="status" id="py-status" role="status"><span class="dot" aria-hidden="true"></span><span class="status-text">Python: starting</span></p>
  <p class="status" id="model-status" role="status"><span class="dot" aria-hidden="true"></span><span class="status-text">Model: checking</span></p>
  <button class="btn" id="restart" type="button" title="Start a fresh Python session">Restart Python</button>
  <button class="btn" id="present" type="button" title="Toggle slides-only mode (key: P)"><span id="present-label">Slides only</span></button>
</header>
<main class="stage">
  <section class="slide-pane" id="slide-pane" aria-label="Slide"></section>
  <section class="cells-pane" id="cells-pane" aria-label="Code cells"></section>
</main>
<footer class="steps-bar">
  <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
  <button class="btn nav-circle" id="prev" type="button" aria-label="Previous slide" title="Previous slide (←)">
    <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </button>
  <nav class="steps" id="steps" aria-label="Pages"></nav>
  <button class="btn nav-circle" id="next" type="button" aria-label="Next slide" title="Next slide (→)">
    <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <p class="count" id="count"></p>
</footer>
<noscript><p class="noscript">This tutorial page needs JavaScript to show slides and run code cells.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
