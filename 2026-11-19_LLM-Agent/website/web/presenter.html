<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter notes</title>
<style>
  :root { --ink: #1C3D52; --accent: #8F1B30; --muted: #6B7785; --rule: #E2E7EC; --bg: #F6F8FA; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1D2833; background: var(--bg); }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--rule); position: sticky; top: 0; }
  .page { font-weight: 700; color: var(--ink); font-size: 1.05rem; }
  .part { color: var(--accent); font-weight: 600; }
  .clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 700; color: var(--ink); }
  .clock.late { color: var(--accent); }
  .target { color: var(--muted); font-variant-numeric: tabular-nums; }
  button { font: inherit; border: 1px solid #C9D2DA; background: #fff; border-radius: 8px; padding: 6px 14px; cursor: pointer; color: var(--ink); }
  button:hover { background: #EEF2F5; }
  main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; padding: 18px 20px 28px; }
  section { background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 14px 18px; }
  h1 { font-size: 1.45rem; margin: 0 0 10px; color: var(--ink); line-height: 1.25; }
  h2 { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  ol.keys { margin: 0; padding-left: 1.3em; font-size: 1.32rem; line-height: 1.5; }
  ol.keys li { margin: 4px 0; }
  ol.keys li::marker { color: var(--accent); font-weight: 700; }
  .cells li { margin: 4px 0; }
  .cells code { background: #EEF2F5; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .say { display: grid; gap: 8px; }
  .say div { border-left: 3px solid var(--accent); padding-left: 10px; }
  .say .zh { color: var(--muted); font-size: 0.9rem; }
  .say .en { font-size: 1.08rem; }
  .next { color: var(--muted); }
  .next b { color: var(--ink); }
  .side { display: grid; gap: 18px; align-content: start; }
  .hint { color: var(--muted); font-size: 0.85rem; padding: 0 20px 20px; }
  .waiting { padding: 40px 20px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <button id="prev" type="button" title="Previous slide (←)">←</button>
  <span class="page" id="page"></span>
  <span class="part" id="part"></span>
  <button id="next" type="button" title="Next slide (→)">→</button>
  <span class="clock" id="clock">0:00</span>
  <span class="target" id="target"></span>
  <button id="timer" type="button">Start timer</button>
</header>
<div id="root"><p class="waiting">Waiting for the main page… keep http://127.0.0.1:8790 open in another window of the same browser.</p></div>
<p class="hint">Arrow keys here also turn the projected page. Keep this window on the laptop screen.</p>
<script type="module" src="presenter.js"></script>
</body>
</html>
